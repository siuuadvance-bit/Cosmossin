name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps || true

      - name: Generate Capacitor Assets (Icon & Splash)
        run: |
          npm install @capacitor/assets --save-dev
          npx @capacitor/assets generate --android --icon image.png --splash splash.png

      - name: Copy Web Assets to Android
        run: npx cap copy android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Remove Termux AAPT2 override from properties
        run: |
          sed -i '/aapt2FromMavenOverride/d' android/gradle.properties || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Align and Sign Release APK
        run: |
          BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0
          APK_PATH=android/app/build/outputs/apk/release
          $BUILD_TOOLS/zipalign -v -p 4 $APK_PATH/app-release-unsigned.apk $APK_PATH/CosmosSim-aligned.apk
          keytool -genkey -v -keystore test.keystore -alias test -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=CosmosSim"
          $BUILD_TOOLS/apksigner sign --ks test.keystore --ks-pass pass:123456 --out $APK_PATH/CosmosSim-Signed.apk $APK_PATH/CosmosSim-aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CosmosSim-Release-APK
          path: android/app/build/outputs/apk/release/CosmosSim-Signed.apk

